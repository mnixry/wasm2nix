[package]
edition = "2024"
name    = "wasm2nix"
version = "0.1.0"

[dependencies]
clap               = { version = "4.5.54", features = ["derive"] }
cranelift-codegen  = "*"
cranelift-entity   = "*"
cranelift-frontend = "*"
cranelift-wasm     = "0.112.3"
snafu              = "0.8.9"
tracing            = "0.1.44"

[dependencies.wasmparser]
features = ["features"]
version  = "0.217.1"

[dev-dependencies]
serde_json = "1.0"
tempfile   = "3.14.0"
wast       = "250.0.0"

[workspace.lints.rust]
unsafe_code = "deny"
warnings    = "warn"

[workspace.lints.clippy]
all = "warn"
