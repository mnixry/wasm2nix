[workspace]
members  = ["crates/*", "example"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
clap               = { version = "4.5.54", features = ["derive"] }
cranelift-codegen  = "*"
cranelift-entity   = "*"
cranelift-frontend = "*"
cranelift-wasm     = "0.112.3"
serde_json         = "1.0"
snafu              = "0.8.9"
target-lexicon     = "0.12.16"
tempfile           = "3.14.0"
tracing            = "0.1.44"
wasm2nix           = { path = "crates/lib" }
wasm2nix-ast       = { path = "crates/nix" }
wast               = "250.0.0"

[workspace.dependencies.wasmparser]
features = ["features"]
version  = "0.217.1"

[workspace.lints.rust]
unsafe_code = "deny"
warnings    = "warn"

[workspace.lints.clippy]
all = "warn"
