[workspace]
members  = ["crates/*", "example"]
metadata = { crane.name = "wasm2nix" }
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
clap               = { version = "4.6.7", features = ["derive"] }
cranelift-codegen  = "0.112.3"
cranelift-entity   = "0.112.3"
cranelift-frontend = "0.112.3"
cranelift-wasm     = "0.112.3"
hex                = { version = "0.4.3", features = ["alloc"] }
pretty             = "0.12.5"
proc-macro2        = "1.0.107"
quote              = "1.0.47"
serde              = { version = "1.0.229", features = ["derive"] }
serde_json         = "1.0"
shlex              = "2.0.1"
snafu              = "0.9.2"
syn                = { version = "3.0.9", features = ["full"] }
target-lexicon     = "0.12.16"
tempfile           = "3.27.0"
wast               = "262.0.0"

[workspace.dependencies.wasmparser]
features = ["features"]
version  = "0.217.1"

[profile.release]
codegen-units = 1
lto           = true
opt-level     = 3

[workspace.lints.rust]
warnings = "warn"

unfulfilled_lint_expectations = "deny"
unknown_lints                 = "deny"
unsafe_code                   = "deny"
unused_extern_crates          = "warn"
unused_must_use               = "deny"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

cargo_common_metadata    = "allow"
cast_possible_truncation = "allow"
inline_always            = "allow"
multiple_crate_versions  = "allow"

# Restriction lints, which no group above enables. Panic risks:
arithmetic_side_effects = "warn"
get_unwrap              = "warn"
indexing_slicing        = "warn"
panic                   = "warn"
panic_in_result_fn      = "warn"
string_slice            = "warn"
todo                    = "warn"
unimplemented           = "warn"
unwrap_in_result        = "warn"
unwrap_used             = "warn"

# Lost errors and computations.
assertions_on_result_states = "warn"
let_underscore_must_use     = "warn"
map_err_ignore              = "warn"
unused_result_ok            = "warn"

# Memory and numeric correctness.
float_cmp_const               = "warn"
lossy_float_literal           = "warn"
mem_forget                    = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks    = "warn"
unnecessary_safety_comment    = "warn"
unnecessary_safety_doc        = "warn"

# API consistency and diagnostics.
allow_attributes                = "warn"
allow_attributes_without_reason = "warn"
dbg_macro                       = "deny"
rc_mutex                        = "warn"

# Pedantic, raised to deny.
wildcard_imports = "deny"

# Relaxations of `all`.
field_reassign_with_default = "allow"
manual_range_contains       = "allow"
new_without_default         = "allow"
