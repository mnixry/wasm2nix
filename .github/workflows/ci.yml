name: Nix Flake Check
on:
  push:
jobs:
  check:
    strategy:
      matrix:
        runs-on: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@main
      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://install.determinate.systems?trusted=true https://cache.numtide.com?trusted=true
      - uses: Mic92/niks3-action@main
        with:
          server-url: https://${{ secrets.NIKS3_SERVER_HOST }}
      - uses: actions/cache@main
        with:
          path: ~/.cache/nix
          key: nix-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: nix-cache-${{ runner.os }}-${{ runner.arch }}-
      - run: nix flake check --print-build-logs --max-jobs 1
