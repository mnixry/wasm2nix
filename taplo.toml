exclude = [
  "**/target/**",
  "**/vendor/**",
  "**/generated/**",
  "crates/wast/tests/spec/**",
]
include = ["**/*.toml"]

[formatting]
align_comments        = true
align_entries         = true
align_single_comments = true
crlf                  = false
reorder_arrays        = false
reorder_keys          = true
